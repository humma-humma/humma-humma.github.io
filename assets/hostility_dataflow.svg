<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 50 1710 1330" width="1710" height="1330" font-family="Helvetica, Arial, sans-serif" font-size="27" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="30" y="50" width="1710" height="1330" fill="#ffffff"/>

  <g stroke="#222" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <!-- Top row -->
    <line x1="403" y1="190" x2="450" y2="190"/>
    <line x1="652" y1="190" x2="710" y2="190"/>
    <line x1="1066" y1="190" x2="1142" y2="190"/>
    <!-- Dataset -> pre-processing (training) -->
    <line x1="328" y1="305" x2="328" y2="503"/>
    <!-- Binary model hostile predictions -> pre-processing -->
    <polyline points="889,270 889,377 585,377 512,512"/>
    <!-- Pre-processing -> FastText -->
    <line x1="328" y1="812" x2="328" y2="946"/>
    <!-- FastText -> classifiers -->
    <line x1="464" y1="1051" x2="730" y2="1051"/>
    <polyline points="600,1051 600,632 730,632"/>
    <polyline points="600,838 730,838"/>
    <polyline points="600,1051 600,1275 730,1275"/>
    <!-- Classifiers -> predictions -->
    <line x1="931" y1="632" x2="1027" y2="632"/>
    <line x1="931" y1="838" x2="1027" y2="838"/>
    <line x1="931" y1="1051" x2="1027" y2="1051"/>
    <line x1="931" y1="1275" x2="1027" y2="1275"/>
    <!-- Predictions -> combine -->
    <polyline points="1244,632 1416,632 1416,909"/>
    <polyline points="1244,838 1309,838 1309,912 1380,912"/>
    <polyline points="1244,1051 1309,1051 1309,994 1380,994"/>
    <polyline points="1244,1275 1416,1275 1416,997"/>
    <line x1="1458" y1="953" x2="1505" y2="953"/>
  </g>

  <!-- Blue data nodes -->
  <g fill="#dae8fc" stroke="#6c8ebf" stroke-width="2.5">
    <ellipse cx="328" cy="190" rx="75" ry="115"/>
    <rect x="452" y="113" width="200" height="157"/>
    <rect x="1144" y="113" width="200" height="157"/>
    <rect x="597" y="383" width="239" height="66"/>
    <rect x="1029" y="555" width="215" height="155"/>
    <rect x="1029" y="760" width="215" height="155"/>
    <rect x="1029" y="973" width="215" height="155"/>
    <rect x="1029" y="1197" width="215" height="155"/>
    <rect x="1507" y="875" width="199" height="155"/>
    <circle cx="1416" cy="953" r="42"/>
  </g>
  <g stroke="#6c8ebf" stroke-width="2.5">
    <line x1="1374" y1="953" x2="1458" y2="953"/>
    <line x1="1416" y1="911" x2="1416" y2="995"/>
  </g>

  <!-- Yellow model nodes (process shape) -->
  <g fill="#fff2cc" stroke="#d6b656" stroke-width="2.5">
    <rect x="712" y="113" width="354" height="157"/>
    <line x1="744" y1="113" x2="744" y2="270"/>
    <line x1="1034" y1="113" x2="1034" y2="270"/>
    <rect x="193" y="948" width="271" height="207"/>
    <line x1="221" y1="948" x2="221" y2="1155"/>
    <line x1="436" y1="948" x2="436" y2="1155"/>
  </g>

  <!-- Pre-processing -->
  <rect x="148" y="505" width="362" height="307" rx="30" fill="#f8cecc" stroke="#b85450" stroke-width="2.5"/>

  <!-- Green ensemble classifiers -->
  <g fill="#d5e8d4" stroke="#82b366" stroke-width="2.5">
    <rect x="732" y="555" width="199" height="155" rx="20"/>
    <rect x="732" y="760" width="199" height="155" rx="20"/>
    <rect x="732" y="973" width="199" height="155" rx="20"/>
    <rect x="732" y="1197" width="199" height="155" rx="20"/>
  </g>

  <!-- Labels -->
  <g fill="#1a1a1a">
    <text x="328" y="163">Hostile</text><text x="328" y="197">Tweets</text><text x="328" y="231">Dataset</text>
    <text x="552" y="180">Hostile/Non-</text><text x="552" y="214">Hostile tweets</text>
    <text x="889" y="162" font-size="25">Hinglish BERT-based</text><text x="889" y="196" font-size="25">binary classifier for</text><text x="889" y="230" font-size="25">hostile/non-hostile</text>
    <text x="1244" y="180">Non-Hostile</text><text x="1244" y="214">Predictions</text>
    <text x="180" y="376" font-size="24">Drop non-hostile samples</text><text x="180" y="408" font-size="24">(for training purposes)</text>
    <text x="716" y="425" font-size="24">Hostile Predictions</text>
    <text x="329" y="551" font-weight="bold">Pre-processing</text>
    <text x="329" y="620">removal of emails, URLs,</text>
    <text x="329" y="660">mentions, hashtags,</text>
    <text x="329" y="700">emojis, emoticons,</text>
    <text x="329" y="740">reserved words</text>
    <text x="328" y="1043" font-size="25">Pretrained Hindi</text><text x="328" y="1077">FastText model</text>
    <text x="831" y="607">Ensemble</text><text x="831" y="641">hate</text><text x="831" y="675">classifier</text>
    <text x="831" y="813">Ensemble</text><text x="831" y="847">fake</text><text x="831" y="881">classifier</text>
    <text x="831" y="1026">Ensemble</text><text x="831" y="1060">defamation</text><text x="831" y="1094">classifier</text>
    <text x="831" y="1250">Ensemble</text><text x="831" y="1284">offensive</text><text x="831" y="1318">classifier</text>
    <text x="1136" y="624">Hate</text><text x="1136" y="658">predictions</text>
    <text x="1136" y="830">Fake</text><text x="1136" y="864">predictions</text>
    <text x="1136" y="1043">Defamation</text><text x="1136" y="1077">predictions</text>
    <text x="1136" y="1267">Offensive</text><text x="1136" y="1301">predictions</text>
    <text x="1606" y="928">Final</text><text x="1606" y="962">multi-label</text><text x="1606" y="996">prediction</text>
  </g>
</svg>
